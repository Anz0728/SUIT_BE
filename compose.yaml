services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suit
      POSTGRES_USER: suit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - suit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suit -d suit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      SUIT_ENV: production
      SUIT_DATABASE_URL: postgresql+psycopg://suit:${POSTGRES_PASSWORD}@db:5432/suit
      SUIT_JWT_SECRET: ${SUIT_JWT_SECRET:?set SUIT_JWT_SECRET}
      SUIT_CORS_ORIGINS: ${SUIT_CORS_ORIGINS:-["https://suit-woad.vercel.app"]}
      SUIT_ALLOWED_HOSTS: ${SUIT_ALLOWED_HOSTS:-["api.example.com"]}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  suit_postgres:

